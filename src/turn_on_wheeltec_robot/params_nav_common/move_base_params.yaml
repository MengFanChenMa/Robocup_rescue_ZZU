#Navigation官方介绍：http://wiki.ros.org/navigation/Tutorials
#Navigation官方讲解：http://wiki.ros.org/navigation/Tutorials/RobotSetup
#move_base官方介绍：http://wiki.ros.org/move_base

#设置全局路径规划器
#base_global_planner: "carrot_planner/CarrotPlanner"
#base_global_planner: "navfn/NavfnROS" 
base_global_planner: "global_planner/GlobalPlanner"

#设置局部路径规划器
#局部路径规划器会在文件【teb_local_planner.launch】、【dwa_local_planner.launch】对应文件内重新设置
#base_local_planner: "dwa_local_planner/DWAPlannerROS"
base_local_planner: "teb_local_planner/TebLocalPlannerROS"

#发布机器人速度控制命令话题cmd_vel的频率，单位：Hz
controller_frequency: 4.0 

#全局路径规划器的规划频率，如果设置为0，仅在设置目标点位置时执行一次，单位：Hz
planner_frequency: 1.0  

#路径规划失败后，尝试重新规划几次后才执行恢复行为，如果设置为-1，代表无限重试
max_planning_retries: 1  

#当move_base在不活动状态时,是否关掉代价地图的更新
shutdown_costmaps: false  

#配置恢复行为（仅保留第3步：慢速移动+清图）
recovery_behaviors:
  # 第一步：先原地旋转刷新观测，尽量不改变位姿
  - name: 'recovery_behavior_rotate'
    type: 'rotate_recovery/RotateRecovery'
  # 第二步：再清理近场代价地图，去除局部脏障碍
  - name: 'recovery_behavior_clear'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  # 第三步：最后才慢速移动+清图（最激进，放末位）
  - name: 'recovery_behavior_move_slow'
    type: 'move_slow_and_clear/MoveSlowAndClear'

#是否开启恢复行为
recovery_behavior_enabled: true
#允许恢复流程中的旋转动作
clearing_rotation_allowed: true

#执行恢复行为时，与机器人距离3米外的障碍物会被清除，单位：s。注意，此参数仅在move_base使用默认恢复行为时使用。
conservative_reset_dist: 3.0

#路径规划无法成功多长时间后，执行恢复行为，单位：s
# 适度放宽，减少偶发波动触发恢复
planner_patience: 12.0
#控制失败持续多久后触发恢复，单位：s
# 适度放宽，避免短时局部不稳定引发误恢复
controller_patience: 12.0

#当机器人运动幅度不大于该值时，认为可能振荡，单位：m
# 适度增大，避免微小抖动频繁累计
oscillation_distance: 0.04
#振荡持续多久后触发恢复，单位：s
# 显著放宽，确保“长期无效运动”才进入恢复
oscillation_timeout: 30.0

#设置恢复行为参数（命名需与recovery_behaviors中的name一致）
recovery_behavior_rotate:
  # RotateRecovery通常无需额外参数，保留空命名空间以便后续扩展
  {}

recovery_behavior_clear:
  # 清图半径（机器人外）适中，避免过度清除远处有效障碍
  reset_distance: 2.0

recovery_behavior_move_slow:
  # 慢速移动时清除障碍范围，避免过大导致误清图
  clearing_distance: 2.0
  # 限制恢复行为时机器人的线速度，单位：m/s
  limited_trans_speed: 0.08
  # 限制恢复行为时机器人的角速度，单位：rad/s
  limited_rot_speed: 0.25
  # 完成该恢复行为机器人必须移动的距离，单位：m
  limited_distance: 0.15
  # 对应的局部路径规划器命名空间
  planner_namespace: TebLocalPlannerROS
